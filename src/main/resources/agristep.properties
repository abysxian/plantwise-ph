# PlantWise database settings.
# To change the database, copy this file next to the program (the project folder) and edit the copy.
#
# db.type = h2     No install needed. Data is saved in the "data" folder.
# db.type = mysql  Uses MySQL / XAMPP. Start MySQL in XAMPP first; the "agristep_swing" database is created for you.
db.type=h2

# --- H2 ---
h2.path=./data/agristep

# --- MySQL (XAMPP defaults: user root, empty password) ---
mysql.url=jdbc:mysql://localhost:3306/agristep_swing?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
mysql.user=root
mysql.password=
